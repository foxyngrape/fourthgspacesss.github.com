<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thành Viên - Nhóm 4</title>
    <style>
       body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: #f4f5ee;
            color: #3b4e42;
            margin:0;
            padding:0;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: #e2e8df;
        }
        .logo {
            font-weight: bold;
            font-size: 20px;
            color: #3b4e42;
        }
        nav a {
            margin-left: 20px;
            text-decoration: none;
            color: #3b4e42;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 4px;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            text-align: center;
        }
        .grid-members {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        .member-card {
            background-color: #ffffff;
            padding: 15px;
            border: 2px solid #5a7361;
            border-radius: 8px;
            width: 180px;
        }
        .member-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 6px;
            background-color: #c2d1c2;
        }
        .member-card p {
            margin-top: 10px;
            font-weight: bold;
            color: #3b4e42;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Nhóm 4</div>
        <nav>
            <a href="index.html">Trang chủ</a>
            <a href="thanhvien.html">Thành viên</a>
            <a href="tonghopbaitap.html">Bài tập</a>
        </nav>
    </header>

    <div class="container">
        <h2>DANH SÁCH THÀNH VIÊN</h2>
        <div class="grid-members">
            <div class="member-card">
                <p>Thái Vũ Bảo</p>
            </div>
            <div class="member-card">
                <p>Trần Lê Quốc Thịnh</p>
            </div>
            <div class="member-card">
                <p>Phùng Quốc Thịnh</p>
            </div>
        </div>
        <div class="grid-members">
            <div class="member-card">
                <p>Trương Thảo Phương</p>
            </div>
            <div class="member-card">
                <p>Phạm Thị Thuý Hồng</p>
            </div>
        </div>
    </div>

</body>
</html>
